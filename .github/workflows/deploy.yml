name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two production deploys at once; queue them instead of cancelling
# a deploy that is already applying changes on the server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            cd /var/www/kasamahr
            git fetch origin main
            git reset --hard origin/main
            bash deploy.sh
